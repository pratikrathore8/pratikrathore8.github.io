- id: subsurfacegen
  title: "SubsurfaceGen: Procedural Generation of Field-Scale Earth Models and Seismic Data"
  url: "https://arxiv.org/abs/2605.30541"
  authors: [stitt, self, udell, lai]
  venue: "submitted, 2026"
  links:
    - { label: arXiv,   url: "https://arxiv.org/abs/2605.30541" }
    - { label: code,    url: "https://anonymous.4open.science/r/subsurfacegen-8961" }
    - { label: dataset, url: "https://huggingface.co/datasets/subsurfacegen/field-scale-dataset" }
  abstract: >
    Full waveform inversion (FWI) is the gold standard for subsurface imaging, but is computationally expensive.
    Machine learning (ML) is promising for accelerating FWI, but ML-based approaches need field-scale, geologically diverse, and physically realistic datasets, which are unavailable in the literature.
    We address these limitations with SubsurfaceGen, a GPU-accelerated generator for 3D velocity models and seismic data, which we use to create a field-scale, geologically diverse, physically realistic dataset (available on Hugging Face).
    Our experiments on this dataset demonstrate SubsurfaceGen's potential to accelerate the development of ML-based FWI methods.

- id: gps
  title: "Turbocharging Gaussian Process Inference with Approximate Sketch-and-Project"
  url: "https://arxiv.org/abs/2505.13723"
  authors: [self, frangella, garg, fazliani, derezinski, udell]
  venue: "NeurIPS, 2025"
  links:
    - { label: arXiv, url: "https://arxiv.org/abs/2505.13723" }
    - { label: code,  url: "https://github.com/pratikrathore8/scalable_gp_inference" }
  abstract: >
    We develop an approximate, distributed, accelerated sketch-and-project
    method that scales Gaussian process inference to hundreds of millions of samples.

- id: askotch
  title: "Have ASkotch: A Neat Solution for Large-scale Kernel Ridge Regression"
  url: "https://arxiv.org/abs/2407.10070"
  authors: [self, frangella, yang, derezinski, udell]
  venue: "submitted, 2025"
  links:
    - { label: arXiv, url: "https://arxiv.org/abs/2407.10070" }
    - { label: code,  url: "https://github.com/pratikrathore8/fast_krr" }
  abstract: >
    We develop ASkotch, a scalable, accelerated, iterative method for full
    kernel ridge regression (KRR) that provably obtains linear convergence.
    ASkotch outperforms state-of-the-art KRR solvers on a testbed of 23 large-scale
    KRR regression and classification tasks derived from a wide range of application domains.
    Our work opens up the possibility of as-yet-unimagined applications of
    full KRR across a number of disciplines.

- id: pinns
  title: "Challenges in Training PINNs: A Loss Landscape Perspective"
  url: "https://arxiv.org/abs/2402.01868"
  authors: [self, lei, frangella, lulu, udell]
  venue: "ICML, 2024, <strong>Oral (top 1.5% of submissions)</strong>"
  links:
    - { label: arXiv, url: "https://arxiv.org/abs/2402.01868" }
    - { label: code,  url: "https://github.com/pratikrathore8/opt_for_pinns" }
  abstract: >
    We study challenges in training physics-informed neural networks. We link training issues to ill-conditioning of the loss,
    and show a combined Adam and L-BFGS approach, along with a new optimizer, NysNewton-CG, enhances PINN performance.

- id: promise
  title: "PROMISE: Preconditioned Stochastic Optimization Methods by Incorporating Scalable Curvature Estimates"
  url: "https://arxiv.org/abs/2309.02014"
  authors: [frangella, self, zhao, udell]
  equal_contrib: [frangella, self]
  venue: "JMLR, 2024"
  links:
    - { label: arXiv, url: "https://arxiv.org/abs/2309.02014" }
    - { label: code,  url: "https://github.com/udellgroup/PROMISE" }
  abstract: >
    We propose PROMISE, a family of preconditioned stochastic optimization methods that use scalable, randomized curvature estimates to solve
    large-scale, ill-conditioned convex optimization problems in machine learning.
    PROMISE methods, with <em>default</em> hyperparameters, outperform popular <em>tuned</em> stochastic optimizers on ridge and logistic regression.
    Furthermore, we introduce <em>quadratic regularity</em>, which determines the speed of linear convergence for PROMISE methods
    and allows us to obtain improved rates for ridge regresison.

- id: sketchysgd
  title: "SketchySGD: Reliable Stochastic Optimization via Randomized Curvature Estimates"
  url: "https://arxiv.org/abs/2211.08597"
  authors: [frangella, self, zhao, udell]
  venue: "SIMODS, 2024"
  links:
    - { label: arXiv, url: "https://arxiv.org/abs/2211.08597" }
    - { label: code,  url: "https://github.com/udellgroup/SketchySGD/tree/main/convex" }
  abstract: >
    We use techniques from randomized numerical linear algebra to develop a fast, scalable, preconditioned stochastic gradient method for convex machine learning problems.

